name: Imagem do servidor do Papo

# Compila a imagem Docker do servidor no GitHub (de graça) e publica no ghcr.io.
# A VPS só baixa a imagem pronta: compilar lá gastaria memória e processador dos outros serviços.
on:
  push:
    branches: [companheiro-discord]
    paths:
      - "server/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "package.json"
      - "package-lock.json"
      - "deploy/Dockerfile"
      - ".dockerignore"
      - ".github/workflows/papo-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: papo-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/papo-server
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
